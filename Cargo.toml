[workspace]
members = [
    "crates/compozy-client",
    "crates/batuta-tui",
    "crates/batuta",
    "crates/compozy-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0-beta.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/franciscpd/batuta-cli"

[workspace.dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
eventsource-stream = "0.2.3"
form_urlencoded = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = "1.11"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
ratatui = "0.30.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "0.8"
tokio = { version = "1.53", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-service = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-markdown = "0.3.9"
tui-textarea-2 = { version = "0.12.1", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
wiremock = "0.6.5"
tempfile = "3"
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
