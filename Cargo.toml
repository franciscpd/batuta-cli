[workspace]
members = [
    "crates/compozy-client",
    "crates/batuta-tui",
    "crates/batuta",
    "crates/compozy-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
eventsource-stream = "0.2.3"
form_urlencoded = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = "1.11"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
tower-service = "0.3"
tracing = "0.1"
tui-markdown = "0.3.9"
unicode-width = "0.2"
wiremock = "0.6.5"
