name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keep this daemon pin aligned with contract/README.md's API-shape pin.
  COMPOZY_DAEMON_VERSION: v0.3.0-beta.16

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace

  boundaries:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install boundary-check tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      - run: scripts/check-boundaries.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Actions checkout is a fresh disposable worktree, so it must remain free
      # of .compozy/ for compozy-testkit contract tests. Keep this guard if
      # checkout caching is introduced later.
      - name: Verify clean contract-test checkout
        run: |
          if [ -d .compozy ]; then
            echo "ERROR: contract tests must run without a .compozy/ directory" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install pinned CompozyOS daemon
        id: install-compozy
        env:
          COMPOZY_DAEMON_VERSION: ${{ env.COMPOZY_DAEMON_VERSION }}
        run: |
          set -euo pipefail
          go install "github.com/compozy/compozy@${COMPOZY_DAEMON_VERSION}"
          go_bin="$(go env GOPATH)/bin"
          test -x "${go_bin}/compozy"
          echo "${go_bin}" >> "$GITHUB_PATH"
          echo "bin=${go_bin}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run contract tests against pinned daemon
        env:
          COMPOZY_TEST_DAEMON_BIN: ${{ steps.install-compozy.outputs.bin }}/compozy
        run: cargo test -p compozy-client --test contract
