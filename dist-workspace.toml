[workspace]
members = ["cargo:."]
# Only the end-user CLI is distributable; all library/test crates are internal.
packages = ["batuta"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Release builds are permitted only after the human-gated release PR merge.
pr-run-mode = "skip"
# Cancel sibling matrix builds after the first platform failure; publishing also
# depends on every build job succeeding, so a partial Release cannot be created.
fail-fast = true
# A tag must be proven to point at the merged standing release PR before any
# platform build can start.
plan-jobs = ["./verify-release-origin"]
github-custom-job-permissions = { verify-release-origin = { contents = "read", pull-requests = "read" } }
# The installers to generate for each app
installers = []
# Emit SHA-256 sidecars for every downloadable archive.
checksum = "sha256"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
