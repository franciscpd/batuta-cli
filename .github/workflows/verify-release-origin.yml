name: Verify release origin

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a merged standing release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match workspace version $expected_tag" >&2
            exit 1
          fi

          pull_requests="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          matches="$(jq --arg repo "$GITHUB_REPOSITORY" --arg tag "$GITHUB_REF_NAME" '
            [.[] | select(
              .merged_at != null and
              .base.ref == "main" and
              .head.ref == "release-plan" and
              .head.repo.full_name == $repo and
              .title == ("release: " + $tag)
            )] | length
          ' <<<"$pull_requests")"
          if [ "$matches" -ne 1 ]; then
            echo "tag commit must belong to exactly one merged release-plan PR titled release: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          grep -Fq "## [$GITHUB_REF_NAME]" CHANGELOG.md || {
            echo "CHANGELOG.md has no heading for $GITHUB_REF_NAME" >&2
            exit 1
          }
